name: Deploy to WordPress.org

# Version tags (e.g. 1.0.1) are built and deployed to the plugin's SVN
# repository. Preview tags are handled by plugin-preview.yml instead.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: write

jobs:
  deploy:
    name: Deploy ${{ github.ref_name }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check that the tag matches the plugin version
        run: |
          tag="${GITHUB_REF_NAME}"
          grep -Eq "^ \* Version: +${tag}$" fast-url-shortener.php || { echo "::error::Plugin header Version is not ${tag}"; exit 1; }
          grep -Eq "^Stable tag: +${tag}$" readme.txt || { echo "::error::readme.txt Stable tag is not ${tag}"; exit 1; }

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      # dist/ is not committed; build it before deploying.
      - name: Build admin assets
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Deploy to WordPress.org
        id: deploy
        uses: 10up/action-wordpress-plugin-deploy@stable
        with:
          generate-zip: true
        env:
          SVN_USERNAME: ${{ secrets.SVN_USERNAME }}
          SVN_PASSWORD: ${{ secrets.SVN_PASSWORD }}
          SLUG: fast-url-shortener

      - name: Attach the package to a GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" "${{ steps.deploy.outputs.zip-path }}" --title "${GITHUB_REF_NAME}" --generate-notes
